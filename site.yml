---
site:
  title: OpenShift Ops Day Roadshow
  url: https://github.com/rhpds/openshift-days-ops-showroom
  start_page: openshift-days-ops-track::index.adoc

content:
  sources:
    - url: .
      start_path: content

ui:
  bundle:
    url: https://github.com/jnewsome97/rhdp_showroom_theme_execute/releases/download/rh-one-2025-execute-v4/ui-bundle.zip
    snapshot: true
  supplemental_files:
    - path: ./content/supplemental-ui
    - path: ./content/lib
    - path: .nojekyll
    - path: ui.yml
      contents: "static_files: [ .nojekyll ]"

runtime:
  cache_dir: ./.cache/antora

antora:
  extensions:
    - require: ./content/lib/dev-mode.js
      enabled: false

output:
  dir: ./www

# Module attributes for ifeval conditionals in nav.adoc
# In production, these are injected by the showroom workload via user_data
# For local preview, set a module to "true" to show it in the navigation.
#
# 현재 구성: 보안 트랙(레드페이 침해사고) 전용.
# 15/16/17 만 켜고 나머지는 꺼 둡니다. 다시 켜려면 'true' 로 바꾸면 됩니다.
asciidoc:
  attributes:
    toclevels: 2
    # Module flags - matches catalog parameter names (module_enable_*)
    # Getting Started
    module_enable_install: 'false'
    # Core Operations
    module_enable_appmgmt: 'false'
    module_enable_ingress: 'false'
    module_enable_netsec: 'false'
    module_enable_debugging: 'false'
    module_enable_gitops: 'false'
    # Identity & Access
    module_enable_ldap: 'false'
    module_enable_oidc: 'false'
    # Day 2 Operations
    module_enable_observability: 'false'
    module_enable_performance: 'false'
    # Advanced Topics
    module_enable_virt: 'false'
    module_enable_devhub: 'false'
    module_enable_ols: 'false'
    module_enable_acm: 'false'
    # Security Track — 레드페이 침해사고 (활성)
    module_enable_security: 'true'
    module_enable_ztwim: 'true'
    module_enable_vault: 'true'
