# ✅ payment-api-vulnerable.yaml 의 문제를 모두 고친 버전입니다.
#
# 두 매니페스트를 나란히 비교해 보십시오:
#   diff payment-api-vulnerable.yaml payment-api-secure.yaml
#
# 수정 내용:
#   1) 이미지 태그 고정          → 무엇이 실행되는지 재현 가능
#   2) 평문 자격 증명 제거       → 접속 정보만 남김 (비밀은 16번 모듈의 Vault로)
#   3) resources requests/limits → 자원 고갈 공격 방어
#   4) securityContext 강화      → 최소 권한 원칙
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api-secure
  namespace: narupay
  labels:
    app: payment-api-secure
    workshop: narupay-security-track
    posture: hardened
  annotations:
    workshop/description: "동일한 결제 API를 보안 기준에 맞춰 다시 만든 버전"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api-secure
  template:
    metadata:
      labels:
        app: payment-api-secure
        workshop: narupay-security-track
        posture: hardened
    spec:
      containers:
        - name: payment-api
          # ✅ 1) 태그 고정 (운영에서는 digest 고정이 더 안전합니다: ubi9/ubi@sha256:...)
          image: registry.access.redhat.com/ubi9/ubi:9.4
          command: ["/bin/sh", "-c", "echo 'NaruPay payment-api (hardened) started'; sleep infinity"]
          env:
            # ✅ 2) 비밀번호 없음. 접속 대상 정보만 남깁니다.
            - name: DB_HOST
              value: "payment-db.narupay.svc.cluster.local"
          # ✅ 3) 자원 제한
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          # ✅ 4) 최소 권한
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # readOnlyRootFilesystem 이므로 쓰기가 필요한 경로는 emptyDir 로 분리
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
