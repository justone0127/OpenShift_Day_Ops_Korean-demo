# 누리페이 침해사고 스토리의 "2단계 공격" 대상을 재현합니다.
#
# 이 매니페스트는 "잘못된 것이 없어 보이는" 흔한 구성입니다.
# 비밀번호를 하드코딩하지 않고 Kubernetes Secret 으로 분리했으니까요.
#
# 16번 모듈에서 이 구성의 실제 보호 수준을 직접 확인합니다:
#   - Secret 의 data 값은 암호화가 아니라 Base64 인코딩입니다
#   - 컨테이너 안에서 `env` 한 줄이면 RBAC 과 무관하게 값이 노출됩니다
#   - 이 비밀번호는 3년째 한 번도 교체되지 않았습니다 (교체할 방법이 없으니까요)
---
apiVersion: v1
kind: Namespace
metadata:
  name: nuripay
  labels:
    workshop: nuripay-security-track
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-db-creds
  namespace: nuripay
  labels:
    workshop: nuripay-security-track
type: Opaque
stringData:
  username: nuripay_app
  # ⚠️ 워크샵 실습용 더미 값입니다. 실제 자격 증명이 아닙니다.
  password: "NuriPay2024!@#"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-secret-app
  namespace: nuripay
  labels:
    app: legacy-secret-app
    workshop: nuripay-security-track
  annotations:
    workshop/description: "Kubernetes Secret 을 환경변수로 주입받는 전형적인 애플리케이션"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy-secret-app
  template:
    metadata:
      labels:
        app: legacy-secret-app
        workshop: nuripay-security-track
    spec:
      containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal:9.4
          command: ["sleep", "infinity"]
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: payment-db-creds
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-db-creds
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
